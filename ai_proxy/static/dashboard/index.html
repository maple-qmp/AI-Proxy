<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AI-Proxy 控制台</title>
<link rel="stylesheet" href="/dashboard/assets/dashboard.css">
<script>
  // Apply the stored theme before first paint so there is no white flash.
  (function () {
    try {
      var saved = localStorage.getItem("ai-proxy.theme");
      var dark = saved === "dark" || (saved === null && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.classList.add("dark");
      else document.documentElement.classList.remove("dark");
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <a class="brand" href="#/logs" title="AI-Proxy">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 20h16L12 3Z"/><path d="M8.5 14h7"/></svg>
        </span>
        <span class="brand-name">AI-Proxy</span>
      </a>
      <button class="icon-btn sb-collapse" id="collapse" title="收起侧栏" aria-label="收起侧栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M15.5 10 13 12l2.5 2"/></svg>
      </button>
    </div>

    <nav class="sb-nav" id="nav">
      <a class="nav-item" data-route="#/logs" href="#/logs" title="LLM 日志">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>
        <span>LLM 日志</span>
      </a>
      <a class="nav-item" data-route="#/models" href="#/models" title="可用模型">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg>
        <span>可用模型</span>
      </a>
      <a class="nav-item" data-route="#/accounts" href="#/accounts" title="登录状态">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
        <span>登录状态</span>
      </a>
    </nav>

    <div class="sb-foot">
      <span class="dot" id="gw-dot"></span>
      <span id="gw-label">连接中…</span>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menu" title="菜单" aria-label="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 id="page-title">LLM 日志</h1>
      <span id="page-desc"></span>
      <div class="topbar-actions">
        <button class="icon-btn" id="theme" title="切换主题" aria-label="切换主题">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5Z"/></svg>
        </button>
        <button class="icon-btn" id="gate-btn" title="网关密钥" aria-label="网关密钥">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="3.2"/><path d="M11.2 12H21M18 12v3M15 12v2.2"/></svg>
        </button>
      </div>
    </header>

    <div class="content-card">
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
</div>

<div id="sheet-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<div id="gate-root"></div>

<script src="/dashboard/assets/dashboard.js"></script>
</body>
</html>
