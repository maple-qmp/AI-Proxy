[project]
name = "ai-proxy"
version = "0.1.0"
description = "Local LiteLLM gateway for ChatGPT subscription and CodeBuddy"
requires-python = ">=3.12,<3.13"
dependencies = ["litellm[proxy]==1.106.1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
